<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F5E3B" />
    <title>Terry-App · Gestión de Residuos</title>
    <meta name="description" content="Terry-App · Gestión de Residuos de Terra Viva S.A.S. E.S.P.: solicitudes, rutas, manifiestos, planta y certificados." />
    <meta name="application-name" content="Terry-App · Residuos" />
    <meta name="apple-mobile-web-app-title" content="Terry Residuos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./iconos/terry-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./iconos/terry-192.png" />
    <script>
      // Enlaces «…/verificar/<código>» (QR de certificados): se abren como «…/#verificar/<código>», que funciona en cualquier hosting.
      (function () { var m = location.pathname.match(/^(.*\/)verificar\/([0-9a-fA-F]{24})\/?$/); if (m) location.replace(m[1] + '#verificar/' + m[2].toLowerCase()); })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
