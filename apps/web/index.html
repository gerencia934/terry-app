<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a3a" />
    <title>TERRY-GO · Terra Viva</title>
    <meta name="application-name" content="TERRY-GO" />
    <meta name="apple-mobile-web-app-title" content="TERRY-GO" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icono.svg" />
    <script>
      // Enlaces «…/verificar/<código>» (QR de certificados): se abren como «…/#verificar/<código>», que funciona en cualquier hosting.
      (function () { var m = location.pathname.match(/^(.*\/)verificar\/([0-9a-fA-F]{24})\/?$/); if (m) location.replace(m[1] + '#verificar/' + m[2].toLowerCase()); })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
