# Escaneo de seguridad del código con CodeQL (requisitos de producción §6).
# Gratis mientras el repositorio sea público. Si se vuelve privado, GitHub exige la licencia
# «GitHub Code Security»; sin ella este flujo falla y se puede desactivar en Actions.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 11 * * 1' # lunes 6:17 a. m. (hora de Colombia)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    name: Analizar JavaScript y TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
