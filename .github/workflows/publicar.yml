# Publica TERRY-GO en Cloudflare cuando las pruebas pasan en main (ver docs/DESPLIEGUE.md):
# primero el servidor (imagen del contenedor + Worker «terra-residuos-api») y luego las pantallas (Pages
# «terra-residuos», que pasan /api al servidor). Necesita en GitHub (Settings › Secrets and variables › Actions)
# CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID; sin ellos no publica nada y lo avisa.
# Las claves del servidor (base de datos, R2, Siigo, Wialon, correo) viven solo en Cloudflare, no aquí.
name: Publicar

on:
  workflow_run:
    workflows: [Pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar en Cloudflare
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: ¿Está conectada la cuenta de Cloudflare?
        id: cuenta
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Sin publicar::Faltan CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en los secretos de GitHub (docs/DESPLIEGUE.md)."
            echo "lista=no" >> "$GITHUB_OUTPUT"
          else
            echo "lista=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cuenta.outputs.lista == 'si'
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-node@v7
        if: steps.cuenta.outputs.lista == 'si'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            despliegue/cloudflare/package-lock.json

      - name: Instalar dependencias
        if: steps.cuenta.outputs.lista == 'si'
        run: |
          npm ci
          npm ci --prefix despliegue/cloudflare

      - name: Compilar las pantallas (el servidor queda en la misma dirección, en /api)
        if: steps.cuenta.outputs.lista == 'si'
        env:
          VITE_API_URL: /api/v1
          VITE_PORTAL_URL: https://app.terravivasas.net
        run: |
          npm run build -w @terraviva/shared
          npm run build -w @terraviva/web

      - name: Servidor (imagen del contenedor y Worker)
        if: steps.cuenta.outputs.lista == 'si'
        working-directory: despliegue/cloudflare/api
        run: npx wrangler deploy

      - name: Pantallas (Pages; el proyecto se crea la primera vez)
        if: steps.cuenta.outputs.lista == 'si'
        working-directory: despliegue/cloudflare/web
        run: |
          if ! npx wrangler pages project list | grep -qw terra-residuos; then
            npx wrangler pages project create terra-residuos --production-branch main
          fi
          npx wrangler pages deploy --branch main --commit-hash "$VERSION" --commit-dirty=true

      - name: Revisar que el servidor responda por Pages
        if: steps.cuenta.outputs.lista == 'si'
        working-directory: despliegue/cloudflare/api
        run: |
          # Sin la base o sin la política de datos (Ley 1581) el servidor no puede arrancar: mientras falten, solo se avisa
          configurado=no
          claves="$(npx wrangler secret list)"
          if echo "$claves" | grep -q DATABASE_URL && echo "$claves" | grep -q POLITICA_DATOS_URL && echo "$claves" | grep -q POLITICA_DATOS_VERSION; then configurado=si; fi
          for i in $(seq 1 30); do
            if curl -sf --max-time 30 https://terra-residuos.pages.dev/api/v1/salud; then echo; exit 0; fi
            sleep 10
          done
          if [ "$configurado" = "si" ]; then
            echo "::error::El servidor no respondió en terra-residuos.pages.dev/api/v1/salud: revise los registros del contenedor en Cloudflare."
            exit 1
          fi
          echo "::warning::El servidor aún no puede arrancar: faltan claves (DATABASE_URL o la política de datos POLITICA_DATOS_URL y POLITICA_DATOS_VERSION). Cárguelas y vuelva a publicar (docs/DESPLIEGUE.md)."

  # Portal Terry-App (app.terravivasas.net): la entrada única del ecosistema. Va en un trabajo aparte: si falla la
  # publicación de Residuos, el portal se publica igual, y al revés (docs/ECOSISTEMA.md).
  portal:
    name: Publicar el portal Terry-App
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: ¿Está conectada la cuenta de Cloudflare?
        id: cuenta
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Sin publicar::Faltan CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en los secretos de GitHub."
            echo "lista=no" >> "$GITHUB_OUTPUT"
          else
            echo "lista=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cuenta.outputs.lista == 'si'
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-node@v7
        if: steps.cuenta.outputs.lista == 'si'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            despliegue/cloudflare/package-lock.json

      - name: Instalar dependencias
        if: steps.cuenta.outputs.lista == 'si'
        run: |
          npm ci
          npm ci --prefix despliegue/cloudflare

      - name: Compilar el portal
        if: steps.cuenta.outputs.lista == 'si'
        run: npm run build -w @terraviva/portal

      - name: Publicar en Pages (pantallas y servidor; el proyecto se crea la primera vez)
        if: steps.cuenta.outputs.lista == 'si'
        working-directory: apps/portal
        run: |
          W=../../despliegue/cloudflare/node_modules/.bin/wrangler
          if ! $W pages project list | grep -qw terry-portal; then
            $W pages project create terry-portal --production-branch main
          fi
          $W pages deploy --branch main --commit-hash "$VERSION" --commit-dirty=true

      - name: Revisar que el portal responda
        if: steps.cuenta.outputs.lista == 'si'
        run: |
          for i in $(seq 1 18); do
            if curl -sf --max-time 20 https://terry-portal.pages.dev/api/v1/salud; then echo; exit 0; fi
            sleep 10
          done
          echo "::warning::El portal no respondió en terry-portal.pages.dev/api/v1/salud: revise sus claves (DATABASE_URL, PORTAL_SECRETO y PORTAL_CLAVE_PRIVADA) en Cloudflare."
