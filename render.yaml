# Render (Blueprint): el servidor de TERRY-GO (API NestJS en un contenedor, siempre encendido). Ver docs/DESPLIEGUE.md.
# Los valores secretos NO van aquí: Render los pide al crear el servicio («sync: false») y se guardan solo en Render.
services:
  - type: web
    name: terry-go-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: virginia # la más cercana a Colombia; no se puede cambiar después
    plan: 1c-2g # 2 GB: los ZIP de certificados y los PDF necesitan memoria
    branch: main
    healthCheckPath: /api/v1/salud
    autoDeployTrigger: checksPass # publica solo cuando las pruebas de GitHub pasan
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Base de datos (Neon, PostgreSQL 16): conexión directa con el usuario de la aplicación (sin saltarse la RLS)
      - key: DATABASE_URL
        sync: false
      # También cifra la verificación en dos pasos: no se cambia después
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        value: https://terrygo.terravivasas.net
      - key: CORS_ORIGINS
        value: https://terrygo.terravivasas.net
      # Ley 1581: sin la política de datos publicada el servidor no arranca
      - key: POLITICA_DATOS_URL
        sync: false
      - key: POLITICA_DATOS_VERSION
        sync: false
      # Correo de salida (invitaciones, recuperar contraseña, alertas)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Archivos en Cloudflare R2
      - key: ALMACENAMIENTO
        value: s3
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Siigo Nube y Wialon (solo lectura)
      - key: SIIGO_USERNAME
        sync: false
      - key: SIIGO_ACCESS_KEY
        sync: false
      - key: SIIGO_PARTNER_ID
        sync: false
      - key: SIIGO_EMPRESA_NIT
        value: 901089780-8
      - key: WIALON_URL
        value: https://hst-api.wialon.us
      - key: WIALON_TOKEN
        sync: false
      - key: WIALON_EMPRESA_NIT
        value: 901089780-8
      # Formulario del sitio web: los prospectos llegan a Terra Viva
      - key: FORMULARIO_WEB_EMPRESA_NIT
        value: 901089780-8
